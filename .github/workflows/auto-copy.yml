name: Auto Copy GeoLite2 File

on:
  schedule:
    # 每天北京时间凌晨 6 点（UTC 22点时间）自动执行
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动点击按钮触发

permissions:
  contents: write

jobs:
  copy-file:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0 

    - name: Copy and replace file
      run: |
        if [ -f "GeoLite2-Country.mmdb" ]; then
          mkdir -p cdnfly
          
          # 核心修改：如果目标文件存在，先将其强制删除
          if [ -f "cdnfly/GeoLite2-Country.mmdb" ]; then
            rm -f cdnfly/GeoLite2-Country.mmdb
            echo "Old target file removed."
          fi
          
          # 复制新文件
          cp GeoLite2-Country.mmdb cdnfly/
          echo "New file copied successfully."
        else
          echo "::error::Source file GeoLite2-Country.mmdb not found!"
          exit 1
        fi

    - name: Commit and push changes
      env:
        TZ: 'Asia/Shanghai'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@github.com"
        
        git add -f cdnfly/GeoLite2-Country.mmdb
        
        CURRENT_TIME=$(date +"%Y-%m-%d %H:%M:%S")
        
        if ! git diff --cached --quiet; then
          echo "Changes detected! Committing changes..."
          git commit -m "Automated update of GeoLite2-Country.mmdb in cdnfly ($CURRENT_TIME)"
        else
          echo "No changes detected. Creating an empty commit to record execution..."
          git commit --allow-empty -m "Automated sync run (No changes) - $CURRENT_TIME"
        fi
        
        git push origin main
