name: Auto Copy GeoLite2 File

on:
  schedule:
    # 每天北京时间凌晨 6 点（UTC 22点时间）自动执行
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动点击按钮触发

env:
  # 修复警告：强制工作流中的 Action 插件使用最新的 Node 24 运行
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  copy-file:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0 

    - name: Copy and replace file
      run: |
        if [ -f "GeoLite2-Country.mmdb" ]; then
          mkdir -p cdnfly
          
          # 修改源文件时间戳，确保即使内容相同也会触发 Git 的真正提交
          touch GeoLite2-Country.mmdb
          
          # 强制复制并覆盖
          cp -f GeoLite2-Country.mmdb cdnfly/
          echo "File copied and overwritten successfully."
        else
          echo "::error::Source file GeoLite2-Country.mmdb not found!"
          exit 1
        fi

    - name: Commit and push changes
      env:
        TZ: 'Asia/Shanghai' # 设置系统时区为北京时间
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@github.com"
        
        # 强制将目标文件添加到暂存区
        git add -f cdnfly/GeoLite2-Country.mmdb
        
        # 获取当前的北京时间
        CURRENT_TIME=$(date +"%Y-%m-%d %H:%M:%S")
        
        # 强制提交更新
        echo "Committing changes..."
        git commit -m "Automated update of GeoLite2-Country.mmdb in cdnfly ($CURRENT_TIME)"
        
        # 推送提交到远程仓库
        git push origin main
