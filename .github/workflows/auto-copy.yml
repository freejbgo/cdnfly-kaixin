name: Auto Copy GeoLite2 File

on:
  schedule:
    # 每天北京时间凌晨 6 点（UTC 22点时间）自动执行
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动点击按钮触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  copy-file:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0 

    - name: Copy and replace file
      run: |
        mkdir -p cdnfly
        
        # 智能查找根目录下包含 geolite2 且以 .mmdb 结尾的文件（忽略大小写）
        REAL_FILE=$(find . -maxdepth 1 -iname "*geolite2*.mmdb" | head -n 1 | sed 's|^\./||')
        
        if [ -n "$REAL_FILE" ]; then
          echo "Found source file: $REAL_FILE"
          
          # 刷新源文件时间戳，确保 Git 认为文件已被修改
          touch "$REAL_FILE"
          
          # 强制复制并统一命名为大写的目标文件
          cp -f "$REAL_FILE" cdnfly/GeoLite2-Country.mmdb
          echo "File copied and overwritten successfully."
        else
          echo "=== Current root files for debugging ==="
          ls -la
          echo "::error::No GeoLite2 .mmdb file found in root directory!"
          exit 1
        fi

    - name: Commit and push changes
      env:
        TZ: 'Asia/Shanghai'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@github.com"
        
        git add -f cdnfly/GeoLite2-Country.mmdb
        CURRENT_TIME=$(date +"%Y-%m-%d %H:%M:%S")
        
        echo "Committing changes..."
        git commit -m "Automated update of GeoLite2-Country.mmdb in cdnfly ($CURRENT_TIME)"
        
        git push origin main
