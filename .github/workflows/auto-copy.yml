name: Auto Copy GeoLite2 File

on:
  schedule:
    # 每天北京时间凌晨 6 点（UTC 22点时间）自动执行
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  copy-file:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0 

    - name: Copy and replace file
      run: |
        if [ -f "GeoLite2-Country.mmdb" ]; then
          mkdir -p cdnfly
          cp -f GeoLite2-Country.mmdb cdnfly/
          echo "File copied successfully."
        else
          echo "::error::Source file GeoLite2-Country.mmdb not found!"
          exit 1
        fi

    - name: Commit and push changes
      env:
        TZ: 'Asia/Shanghai' # 设置时区为北京时间，确保下面 date 命令准确
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@github.com"
        
        # 强制添加 cdnfly 目录下的文件
        git add -f cdnfly/GeoLite2-Country.mmdb
        
        # 获取当前的北京时间
        CURRENT_TIME=$(date +"%Y-%m-%d %H:%M:%S")
        
        if ! git diff --cached --quiet; then
          echo "Changes detected! Committing changes..."
          git commit -m "Automated update of GeoLite2-Country.mmdb in cdnfly ($CURRENT_TIME)"
        else
          echo "No changes detected. Creating an empty commit to record execution..."
          # 核心修复：更安全的空 commit 语法
          git commit --allow-empty -m "Automated sync run (No changes) - $CURRENT_TIME"
        fi
        
        # 推送提交到远程仓库
        git push origin main
