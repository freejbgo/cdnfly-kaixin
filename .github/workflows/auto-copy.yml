name: Auto Copy GeoLite2 File

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  copy-file:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0 # 确保获取完整历史以防推送失败

    - name: Copy and replace file
      run: |
        # 列出当前根目录文件，方便在日志中肉眼检查大小写
        echo "=== Current root files ==="
        ls -la
        
        if [ -f "GeoLite2-Country.mmdb" ]; then
          mkdir -p cdnfly
          cp -f GeoLite2-Country.mmdb cdnfly/
          echo "File copied successfully."
        else
          echo "::error::Source file GeoLite2-Country.mmdb not found! Please check case sensitivity."
          exit 1
        fi

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@github.com"
        
        # 核心改动：使用 -f 强制添加，防止被 .gitignore 策略拦截
        git add -f cdnfly/GeoLite2-Country.mmdb
        
        # 检查是否有内容进入暂存区
        if ! git diff --cached --quiet; then
          echo "Changes detected! Committing..."
          git commit -m "Automated update of GeoLite2-Country.mmdb in cdnfly"
          git push origin main
        else
          echo "No changes detected. The source file and destination file are identical."
        fi
