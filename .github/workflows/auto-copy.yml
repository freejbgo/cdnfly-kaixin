name: Auto Copy GeoLite2 File

on:
  schedule:
    # 每天北京时间凌晨 6 点（UTC 22点时间）自动执行
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  copy-file:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0 # 获取完整历史防止推送冲突

    - name: Copy and replace file
      run: |
        # 检查根目录下是否存在源文件
        if [ -f "GeoLite2-Country.mmdb" ]; then
          mkdir -p cdnfly
          cp -f GeoLite2-Country.mmdb cdnfly/
          echo "File copied successfully."
        else
          echo "::error::Source file GeoLite2-Country.mmdb not found!"
          exit 1
        fi

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@github.com"
        
        # 强制添加文件（防止被 .gitignore 忽略）
        git add -f cdnfly/GeoLite2-Country.mmdb
        
        # 检查是否有内容变化
        if ! git diff --cached --quiet; then
          echo "Changes detected! Committing changes..."
          git commit -m "Automated update of GeoLite2-Country.mmdb in cdnfly"
        else
          echo "No changes detected. Creating an empty commit to record execution..."
          # 核心修改：允许空 commit，并附加当前时间戳
          git commit --allow-empty -m "Automated sync run (No changes in GeoLite2-Country.mmdb) - $(date -u +'%Y-%m-%d %H:%M:%S' -d '+8 hours') CST"
        fi
        
        # 推送提交到远程仓库
        git push origin main
